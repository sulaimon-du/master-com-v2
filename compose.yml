# Local stack in one command: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      POSTGRES_DB: mastercom
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mastercom"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mc:mc@db:5432/mastercom
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Telegram bot, long polling with the development bot's token from .env (README "Telegram bot").
  # Its own process (R-003); no migrations or seed: the web service owns the schema.
  bot:
    # Off by default: it needs TELEGRAM_BOT_TOKEN. Start with `docker compose --profile bot up`.
    profiles: ["bot"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mc:mc@db:5432/mastercom
      TELEGRAM_WEBHOOK_URL: ""
    command: ["python", "-m", "app.bot"]
    # Polling serves no HTTP, so the image's /health check does not apply.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # Background jobs and timers (spec D7). Off by default: `docker compose --profile worker up`.
  # No migrations or seed: the web service owns the schema.
  worker:
    profiles: ["worker"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mc:mc@db:5432/mastercom
    command: ["python", "-m", "app.worker"]
    # The worker serves no HTTP, so the image's /health check does not apply.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
