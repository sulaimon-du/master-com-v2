[project]
name = "master-com"
version = "0.1.0"
description = "Marketplace for construction and home-repair masters in Tajikistan"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "httpx2>=2.13.1",
]

[tool.uv]
# Resolve only releases published at least two weeks before this date (supply-chain hygiene).
exclude-newer = "2026-10-10T00:00:00Z"
# Security fixes may be newer than the cutoff: allow them per package, with the advisory noted.
# certifi PYSEC-2026-4320; filelock CVE-2026-112906 and related (fixed in 4.2.1).
exclude-newer-package = { certifi = "2026-10-24T00:00:00Z", filelock = "2026-10-24T00:00:00Z" }
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# RUF001: test data is Russian and Tajik, so Cyrillic letters are expected.
"tests/**" = ["S101", "S105", "S106", "RUF001"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
