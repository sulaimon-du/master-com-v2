<!doctype html>
<html lang="{{ lang | default('ru') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "selfRequestsOnly": true}'>
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/fonts.css').path }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css').path }}">
  <script src="{{ url_for('static', path='js/htmx.min.js').path }}" defer></script>
  <script src="{{ url_for('static', path='js/alpine-csp.min.js').path }}" defer></script>
</head>
<body class="min-h-dvh" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 btn btn-secondary">{{ t('nav.skip') }}</a>
  <header class="border-b border-line bg-surface">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <a href="/" class="text-lg font-bold no-underline">{{ app_name }}</a>
      {% if user %}
        <a class="btn btn-secondary no-underline" href="{{ url_for('account_page') }}">{{ t('nav.account') }}</a>
      {% else %}
        <a class="btn btn-secondary no-underline" href="{{ url_for('signin_page') }}">{{ t('nav.signin') }}</a>
      {% endif %}
    </div>
  </header>
  <main id="main" class="mx-auto max-w-6xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-6xl px-4 pb-8">
    <nav aria-label="{{ t('footer.lang') }}" class="flex gap-4 text-sm text-muted">
      <a href="{{ url_for('set_lang', code='ru') }}?next={{ request.url.path | urlencode }}" {% if lang == 'ru' %}aria-current="true" class="font-semibold text-ink"{% endif %}>{{ t('lang.ru') }}</a>
      <a href="{{ url_for('set_lang', code='tg') }}?next={{ request.url.path | urlencode }}" {% if lang == 'tg' %}aria-current="true" class="font-semibold text-ink"{% endif %} lang="tg">{{ t('lang.tg') }}</a>
    </nav>
  </footer>
</body>
</html>
