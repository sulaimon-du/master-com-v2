# Staging on Render: two free web services built from the same Dockerfile (site and Telegram bot).
# Database: Neon free Postgres (Render's free Postgres is deleted 30 days after creation).
# Free web services sleep after 15 minutes without traffic; the first request then takes about a minute.
services:
  - type: web
    name: master-com-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: RUN_MIGRATIONS
        value: "1"
      - key: RUN_SEED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard
      - key: FORWARDED_ALLOW_IPS
        value: "*" # traffic reaches the container only through Render's proxy
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP # Render serves through Cloudflare, which sets this header (R-019)
      - key: GOOGLE_CLIENT_ID
        sync: false # optional; add in the Render dashboard when Google sign-in is set up
      - key: GOOGLE_CLIENT_SECRET
        sync: false # optional; secret, dashboard only
      - key: TELEGRAM_BOT_USERNAME
        value: MasterComStagingBot # shows the Telegram buttons; the bot token is never set here (R-021)
      - key: SITE_URL
        value: https://master-com-staging.onrender.com
      # Cloudflare R2 for photos (spec 2026-11-23 §D8); only the site needs these, never the bot.
      - key: R2_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com; dashboard only
      - key: R2_ACCESS_KEY_ID
        sync: false # secret, dashboard only; token limited to this bucket
      - key: R2_SECRET_ACCESS_KEY
        sync: false # secret, dashboard only
      - key: R2_BUCKET
        value: master-com-staging-media
      - key: R2_PUBLIC_URL
        value: https://pub-d77c5213c3b64bc789186e39de9fbe9e.r2.dev
      # Off until the owner checks R2 after the deploy, then set to true in the dashboard.
      - key: UPLOADS_ENABLED
        value: "false"
      - key: SENTRY_DSN
        sync: false # Sentry project DSN (R-024); empty = monitoring off
      # After a commit that queued a job the site GETs this (no payload, 1 s timeout) so the
      # worker in the bot service polls at once and a sleeping bot wakes up (spec D7).
      - key: WORKER_WAKE_URL
        value: https://master-com-bot-staging.onrender.com/health

  # Telegram bot (spec 2026-11-22, D5): its own process, webhook mode, no migrations or seed.
  # A sleeping free service is woken by Telegram's webhook POST; Telegram retries meanwhile.
  # It also runs the job worker in a thread (RUN_WORKER=1, spec 2026-11-26 D7): Render free has
  # no background workers, and this service already holds the bot token (R-021).
  - type: web
    name: master-com-bot-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerCommand: python -m app.bot
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false # the same Neon connection string as the web service
      - key: SECRET_KEY
        generateValue: true # signs only the bot's own buttons; need not match the site's
      - key: TELEGRAM_BOT_TOKEN
        sync: false # the staging bot from BotFather (never the development bot)
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false # random, e.g. python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: TELEGRAM_BOT_USERNAME
        value: MasterComStagingBot
      - key: TELEGRAM_WEBHOOK_URL
        value: https://master-com-bot-staging.onrender.com/telegram/webhook
      - key: SITE_URL
        value: https://master-com-staging.onrender.com
      - key: RUN_WORKER
        value: "1" # jobs and timers; sleeps with the service, woken by the site's ping
      - key: SENTRY_DSN
        sync: false # Sentry project DSN (R-024); empty = monitoring off
